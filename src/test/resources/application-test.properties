# Test application configuration using in-memory H2 database
app.name=ByteForce-Test
app.version=0.1.0-TEST
app.theme=light

db.url=jdbc:h2:mem:byteforce_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
db.username=sa
db.password=

db.pool.name=ByteForce-TestPool
db.pool.maximum-pool-size=5
db.pool.minimum-idle=1
db.pool.idle-timeout-ms=60000
db.pool.max-lifetime-ms=180000
db.pool.connection-timeout-ms=5000

flyway.enabled=true
flyway.locations=classpath:db/migration
