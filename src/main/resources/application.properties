# Application metadata
app.name=ByteForce
app.version=0.1.0-SNAPSHOT
app.theme=light

# Database Configuration (Defaults for local development; override with DB_* env variables)
db.url=jdbc:mysql://localhost:3306/byteforce?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
db.username=root
db.password=

# Connection Pool (HikariCP)
db.pool.name=ByteForce-HikariPool
db.pool.maximum-pool-size=10
db.pool.minimum-idle=2
db.pool.idle-timeout-ms=600000
db.pool.max-lifetime-ms=1800000
db.pool.connection-timeout-ms=30000

# Database Migration (Flyway)
flyway.enabled=true
flyway.locations=classpath:db/migration
