<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${pageTitle})}"></head>
<body>

<div class="app-layout">
    <aside th:replace="~{fragments/layout :: appSidebar('admin-subjects')}"></aside>

    <div class="app-main">
        <header th:replace="~{admin/fragments :: adminTopbar(${pageTitle})}"></header>

        <main class="app-content" style="max-width: 800px; margin: 0 auto; padding: 28px 24px;">
            <div th:replace="~{admin/fragments :: alerts}"></div>

            <div style="margin-bottom: 24px;">
                <a th:href="@{/admin/subjects}" style="color: var(--bf-slate-500); font-size: 0.875rem; display: inline-flex; align-items: center; gap: 4px; margin-bottom: 8px;">
                    ← Back to Subjects
                </a>
                <h2 style="font-size: 1.5rem; font-weight: 700; color: var(--bf-navy-900);" th:text="${isNew ? 'Create New Subject' : 'Edit Subject'}">Subject Form</h2>
            </div>

            <div class="card" style="background: var(--bf-white); border-radius: var(--bf-radius-lg, 12px); border: 1px solid var(--bf-slate-200); padding: 32px; box-shadow: var(--bf-shadow-sm);">
                <form th:action="@{/admin/subjects/save}" method="post">
                    <input type="hidden" name="isNew" th:value="${isNew}" />

                    <!-- Subject ID -->
                    <div style="margin-bottom: 20px;">
                        <label style="display: block; font-size: 0.875rem; font-weight: 600; color: var(--bf-navy-800); margin-bottom: 6px;">
                            Subject ID / Slug <span style="color: var(--bf-danger);">*</span>
                        </label>
                        <input type="text" name="id" th:value="${subject.id}" th:readonly="${!isNew}" required
                               placeholder="e.g. computer-networks"
                               style="width: 100%; padding: 10px 14px; border: 1px solid var(--bf-slate-300); border-radius: var(--bf-radius-md, 8px); font-size: 0.9375rem; font-family: var(--bf-font-mono); background: ${!isNew ? 'var(--bf-slate-100)' : 'var(--bf-white)'};" />
                        <p style="font-size: 0.75rem; color: var(--bf-slate-500); margin-top: 4px;">Unique lower-case identifier used in routing (e.g. /learn/subject/operating-systems).</p>
                    </div>

                    <!-- Subject Name -->
                    <div style="margin-bottom: 20px;">
                        <label style="display: block; font-size: 0.875rem; font-weight: 600; color: var(--bf-navy-800); margin-bottom: 6px;">
                            Subject Name <span style="color: var(--bf-danger);">*</span>
                        </label>
                        <input type="text" name="name" th:value="${subject.name}" required
                               placeholder="e.g. Computer Networks & Distributed Systems"
                               style="width: 100%; padding: 10px 14px; border: 1px solid var(--bf-slate-300); border-radius: var(--bf-radius-md, 8px); font-size: 0.9375rem;" />
                    </div>

                    <!-- Description -->
                    <div style="margin-bottom: 20px;">
                        <label style="display: block; font-size: 0.875rem; font-weight: 600; color: var(--bf-navy-800); margin-bottom: 6px;">
                            Description
                        </label>
                        <textarea name="description" rows="3" placeholder="Brief summary of the subject scope..."
                                  style="width: 100%; padding: 10px 14px; border: 1px solid var(--bf-slate-300); border-radius: var(--bf-radius-md, 8px); font-size: 0.9375rem; resize: vertical;"
                                  th:text="${subject.description}"></textarea>
                    </div>

                    <!-- Display Order -->
                    <div style="margin-bottom: 28px;">
                        <label style="display: block; font-size: 0.875rem; font-weight: 600; color: var(--bf-navy-800); margin-bottom: 6px;">
                            Display Order
                        </label>
                        <input type="number" name="displayOrder" th:value="${subject.displayOrder}"
                               style="width: 140px; padding: 10px 14px; border: 1px solid var(--bf-slate-300); border-radius: var(--bf-radius-md, 8px); font-size: 0.9375rem;" />
                        <p style="font-size: 0.75rem; color: var(--bf-slate-500); margin-top: 4px;">Lower numbers appear first on the Learn homepage.</p>
                    </div>

                    <!-- Buttons -->
                    <div style="display: flex; gap: 12px; border-top: 1px solid var(--bf-slate-200); padding-top: 20px;">
                        <button type="submit" class="btn btn-primary" style="padding: 10px 24px;">Save Subject</button>
                        <a th:href="@{/admin/subjects}" class="btn btn-ghost" style="padding: 10px 20px;">Cancel</a>
                    </div>
                </form>
            </div>
        </main>
    </div>
</div>

</body>
</html>
