<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Manage Subjects')}"></head>
<body>

<div class="app-layout">
    <aside th:replace="~{fragments/layout :: appSidebar('admin-subjects')}"></aside>

    <div class="app-main">
        <header th:replace="~{admin/fragments :: adminTopbar('Manage Subjects')}"></header>

        <main class="app-content" style="max-width: 1200px; margin: 0 auto; padding: 28px 24px;">
            <div th:replace="~{admin/fragments :: alerts}"></div>

            <div th:replace="~{admin/fragments :: adminHeader('Subjects', 'Core academic domains that organize topics and placement curricula.', '/admin/subjects/new', 'Add Subject')}"></div>

            <div class="card" style="background: var(--bf-white); border-radius: var(--bf-radius-lg, 12px); border: 1px solid var(--bf-slate-200); overflow: hidden; box-shadow: var(--bf-shadow-sm);">
                <div style="overflow-x: auto;">
                    <table style="width: 100%; border-collapse: collapse; text-align: left; font-size: 0.875rem;">
                        <thead>
                            <tr style="background: var(--bf-slate-50); border-bottom: 1px solid var(--bf-slate-200); color: var(--bf-slate-500); font-weight: 600; text-transform: uppercase; font-size: 0.75rem; letter-spacing: 0.05em;">
                                <th style="padding: 14px 20px;">Order</th>
                                <th style="padding: 14px 20px;">ID</th>
                                <th style="padding: 14px 20px;">Name</th>
                                <th style="padding: 14px 20px;">Description</th>
                                <th style="padding: 14px 20px;">Topics</th>
                                <th style="padding: 14px 20px; text-align: right;">Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:if="${subjects.empty}">
                                <td colspan="6" style="padding: 32px 20px; text-align: center; color: var(--bf-slate-400);">No subjects found. Click "Add Subject" to create one.</td>
                            </tr>
                            <tr th:each="s : ${subjects}" style="border-bottom: 1px solid var(--bf-slate-100); transition: background 0.15s;" onmouseover="this.style.background='var(--bf-slate-50)'" onmouseout="this.style.background='transparent'">
                                <td style="padding: 14px 20px; font-weight: 600; color: var(--bf-slate-500);" th:text="${s.displayOrder}">1</td>
                                <td style="padding: 14px 20px;">
                                    <code style="background: var(--bf-slate-100); color: var(--bf-navy-800); padding: 2px 6px; border-radius: 4px; font-size: 0.8125rem;" th:text="${s.id}">dbms</code>
                                </td>
                                <td style="padding: 14px 20px; font-weight: 600; color: var(--bf-navy-900);">
                                    <span th:text="${s.name}">Database Management Systems</span>
                                </td>
                                <td style="padding: 14px 20px; color: var(--bf-slate-600); max-width: 320px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;" th:text="${s.description}">Description text...</td>
                                <td style="padding: 14px 20px;">
                                    <a th:href="@{/admin/topics(subjectId=${s.id})}" style="font-weight: 600; color: var(--bf-primary);" th:text="${s.topics != null ? s.topics.size() + ' topics' : '0 topics'}">3 topics</a>
                                </td>
                                <td style="padding: 14px 20px; text-align: right; white-space: nowrap;">
                                    <div style="display: inline-flex; align-items: center; gap: 8px;">
                                        <a th:href="@{'/admin/subjects/' + ${s.id} + '/edit'}" class="btn btn-outline btn-sm" style="padding: 4px 10px; font-size: 0.75rem;">Edit</a>
                                        <form th:action="@{'/admin/subjects/' + ${s.id} + '/delete'}" method="post" style="display: inline;" onsubmit="return confirm('Are you sure you want to delete this subject? This can only be done if no topics are attached.');">
                                            <button type="submit" class="btn btn-danger btn-sm" style="padding: 4px 10px; font-size: 0.75rem;">Delete</button>
                                        </form>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
</div>

</body>
</html>
