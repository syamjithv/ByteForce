<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Manage Aptitude Questions')}"></head>
<body>

<div class="app-layout">
    <aside th:replace="~{fragments/layout :: appSidebar('admin-aptitude')}"></aside>

    <div class="app-main">
        <header th:replace="~{admin/fragments :: adminTopbar('Manage Aptitude Questions')}"></header>

        <main class="app-content" style="max-width: 1200px; margin: 0 auto; padding: 28px 24px;">
            <div th:replace="~{admin/fragments :: alerts}"></div>

            <div th:replace="~{admin/fragments :: adminHeader('Aptitude Questions', 'Placement interview aptitude questions covering Quantitative, Logical Reasoning, and Verbal Ability.', '/admin/aptitude/new', 'Add Aptitude Question')}"></div>

            <!-- Filters Bar -->
            <div class="card" style="background: var(--bf-white); border-radius: var(--bf-radius-md, 8px); border: 1px solid var(--bf-slate-200); padding: 16px 20px; margin-bottom: 24px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap;">
                <span style="font-size: 0.875rem; font-weight: 600; color: var(--bf-navy-800);">Filter by Category:</span>
                <div style="display: flex; gap: 8px; flex-wrap: wrap;">
                    <a th:href="@{/admin/aptitude}" class="btn btn-sm" th:classappend="${selectedCategory == null ? 'btn-primary' : 'btn-outline'}" style="padding: 4px 12px; font-size: 0.8125rem;">All Categories</a>
                    <a th:each="cat : ${categories}" th:href="@{/admin/aptitude(category=${cat})}" class="btn btn-sm" th:classappend="${selectedCategory == cat ? 'btn-primary' : 'btn-outline'}" style="padding: 4px 12px; font-size: 0.8125rem;" th:text="${cat}">QUANTITATIVE</a>
                </div>
            </div>

            <div class="card" style="background: var(--bf-white); border-radius: var(--bf-radius-lg, 12px); border: 1px solid var(--bf-slate-200); overflow: hidden; box-shadow: var(--bf-shadow-sm);">
                <div style="overflow-x: auto;">
                    <table style="width: 100%; border-collapse: collapse; text-align: left; font-size: 0.875rem;">
                        <thead>
                            <tr style="background: var(--bf-slate-50); border-bottom: 1px solid var(--bf-slate-200); color: var(--bf-slate-500); font-weight: 600; text-transform: uppercase; font-size: 0.75rem; letter-spacing: 0.05em;">
                                <th style="padding: 14px 20px;">ID</th>
                                <th style="padding: 14px 20px;">Category</th>
                                <th style="padding: 14px 20px;">Topic</th>
                                <th style="padding: 14px 20px;">Question Prompt</th>
                                <th style="padding: 14px 20px;">Answer</th>
                                <th style="padding: 14px 20px;">Difficulty</th>
                                <th style="padding: 14px 20px;">Status</th>
                                <th style="padding: 14px 20px; text-align: right;">Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:if="${questions.empty}">
                                <td colspan="8" style="padding: 32px 20px; text-align: center; color: var(--bf-slate-400);">No aptitude questions found. Click "Add Aptitude Question" to create one.</td>
                            </tr>
                            <tr th:each="aq : ${questions}" style="border-bottom: 1px solid var(--bf-slate-100); transition: background 0.15s;" onmouseover="this.style.background='var(--bf-slate-50)'" onmouseout="this.style.background='transparent'">
                                <td style="padding: 14px 20px; color: var(--bf-slate-400); font-weight: 600;" th:text="${aq.id}">1</td>
                                <td style="padding: 14px 20px;">
                                    <span class="badge" style="background: rgba(202, 138, 4, 0.1); color: #ca8a04; padding: 4px 8px; border-radius: 4px; font-weight: 600; font-size: 0.75rem;" th:text="${aq.category}">QUANTITATIVE</span>
                                </td>
                                <td style="padding: 14px 20px; font-weight: 600; color: var(--bf-navy-900);">
                                    <span th:text="${aq.topic}">Time & Work</span>
                                </td>
                                <td style="padding: 14px 20px; color: var(--bf-slate-700); max-width: 320px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;" th:text="${aq.question}">Question prompt...</td>
                                <td style="padding: 14px 20px;">
                                    <span class="badge" style="background: rgba(22, 163, 74, 0.1); color: var(--bf-success); padding: 4px 8px; border-radius: 4px; font-weight: 700; font-size: 0.8125rem;" th:text="${'Option ' + aq.correctAnswer}">Option B</span>
                                </td>
                                <td style="padding: 14px 20px;">
                                    <span class="badge" th:classappend="${aq.difficulty.name() == 'EASY' ? 'badge-success' : (aq.difficulty.name() == 'MEDIUM' ? 'badge-warning' : 'badge-danger')}"
                                          style="padding: 4px 8px; border-radius: 4px; font-weight: 600; font-size: 0.75rem;" th:text="${aq.difficulty}">EASY</span>
                                </td>
                                <td style="padding: 14px 20px;">
                                    <span th:if="${aq.isActive}" class="badge badge-success" style="padding: 4px 8px; border-radius: 4px; font-weight: 600; font-size: 0.75rem;">ACTIVE</span>
                                    <span th:if="${!aq.isActive}" class="badge" style="background: var(--bf-slate-100); color: var(--bf-slate-500); padding: 4px 8px; border-radius: 4px; font-weight: 600; font-size: 0.75rem;">INACTIVE</span>
                                </td>
                                <td style="padding: 14px 20px; text-align: right; white-space: nowrap;">
                                    <div style="display: inline-flex; align-items: center; gap: 8px;">
                                        <a th:href="@{'/admin/aptitude/' + ${aq.id} + '/edit'}" class="btn btn-outline btn-sm" style="padding: 4px 10px; font-size: 0.75rem;">Edit</a>
                                        <form th:action="@{'/admin/aptitude/' + ${aq.id} + '/delete'}" method="post" style="display: inline;" onsubmit="return confirm('Are you sure you want to delete this aptitude question?');">
                                            <button type="submit" class="btn btn-danger btn-sm" style="padding: 4px 10px; font-size: 0.75rem;">Delete</button>
                                        </form>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
</div>

</body>
</html>
