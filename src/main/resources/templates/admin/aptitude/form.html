<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${pageTitle})}"></head>
<body>

<div class="app-layout">
    <aside th:replace="~{fragments/layout :: appSidebar('admin-aptitude')}"></aside>

    <div class="app-main">
        <header th:replace="~{admin/fragments :: adminTopbar(${pageTitle})}"></header>

        <main class="app-content" style="max-width: 850px; margin: 0 auto; padding: 28px 24px;">
            <div th:replace="~{admin/fragments :: alerts}"></div>

            <div style="margin-bottom: 24px;">
                <a th:href="@{/admin/aptitude}" style="color: var(--bf-slate-500); font-size: 0.875rem; display: inline-flex; align-items: center; gap: 4px; margin-bottom: 8px;">
                    ← Back to Aptitude Questions
                </a>
                <h2 style="font-size: 1.5rem; font-weight: 700; color: var(--bf-navy-900);" th:text="${isNew ? 'Create Aptitude Question' : 'Edit Aptitude Question'}">Aptitude Form</h2>
            </div>

            <div class="card" style="background: var(--bf-white); border-radius: var(--bf-radius-lg, 12px); border: 1px solid var(--bf-slate-200); padding: 32px; box-shadow: var(--bf-shadow-sm);">
                <form th:action="@{/admin/aptitude/save}" method="post">
                    <input type="hidden" name="id" th:value="${question.id}" />

                    <!-- Row: Category & Topic -->
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px;">
                        <div>
                            <label style="display: block; font-size: 0.875rem; font-weight: 600; color: var(--bf-navy-800); margin-bottom: 6px;">
                                Category <span style="color: var(--bf-danger);">*</span>
                            </label>
                            <select name="category" required style="width: 100%; padding: 10px 14px; border: 1px solid var(--bf-slate-300); border-radius: var(--bf-radius-md, 8px); font-size: 0.9375rem; background: var(--bf-white);">
                                <option th:each="c : ${categories}" th:value="${c}" th:text="${c}" th:selected="${question.category == c}"></option>
                            </select>
                        </div>
                        <div>
                            <label style="display: block; font-size: 0.875rem; font-weight: 600; color: var(--bf-navy-800); margin-bottom: 6px;">
                                Topic Name <span style="color: var(--bf-danger);">*</span>
                            </label>
                            <input type="text" name="topic" th:value="${question.topic}" required
                                   placeholder="e.g. Time & Work, Percentages, Syllogisms"
                                   style="width: 100%; padding: 10px 14px; border: 1px solid var(--bf-slate-300); border-radius: var(--bf-radius-md, 8px); font-size: 0.9375rem;" />
                        </div>
                    </div>

                    <!-- Row: Difficulty & Correct Answer -->
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px;">
                        <div>
                            <label style="display: block; font-size: 0.875rem; font-weight: 600; color: var(--bf-navy-800); margin-bottom: 6px;">
                                Difficulty <span style="color: var(--bf-danger);">*</span>
                            </label>
                            <select name="difficulty" required style="width: 100%; padding: 10px 14px; border: 1px solid var(--bf-slate-300); border-radius: var(--bf-radius-md, 8px); font-size: 0.9375rem; background: var(--bf-white);">
                                <option th:each="d : ${difficulties}" th:value="${d}" th:text="${d}" th:selected="${question.difficulty == d}"></option>
                            </select>
                        </div>
                        <div>
                            <label style="display: block; font-size: 0.875rem; font-weight: 600; color: var(--bf-navy-800); margin-bottom: 6px;">
                                Correct Answer Option <span style="color: var(--bf-danger);">*</span>
                            </label>
                            <select name="correctAnswer" required style="width: 100%; padding: 10px 14px; border: 1px solid var(--bf-slate-300); border-radius: var(--bf-radius-md, 8px); font-size: 0.9375rem; background: var(--bf-white);">
                                <option value="A" th:selected="${question.correctAnswer == 'A'}">Option A</option>
                                <option value="B" th:selected="${question.correctAnswer == 'B'}">Option B</option>
                                <option value="C" th:selected="${question.correctAnswer == 'C'}">Option C</option>
                                <option value="D" th:selected="${question.correctAnswer == 'D'}">Option D</option>
                            </select>
                        </div>
                    </div>

                    <!-- Question Prompt -->
                    <div style="margin-bottom: 20px;">
                        <label style="display: block; font-size: 0.875rem; font-weight: 600; color: var(--bf-navy-800); margin-bottom: 6px;">
                            Question Prompt <span style="color: var(--bf-danger);">*</span>
                        </label>
                        <textarea name="question" rows="4" required
                                  placeholder="Enter the full aptitude question text..."
                                  style="width: 100%; padding: 10px 14px; border: 1px solid var(--bf-slate-300); border-radius: var(--bf-radius-md, 8px); font-size: 0.9375rem; resize: vertical;"
                                  th:text="${question.question}"></textarea>
                    </div>

                    <!-- Options Grid -->
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 20px;">
                        <div>
                            <label style="display: block; font-size: 0.8125rem; font-weight: 600; color: var(--bf-navy-800); margin-bottom: 4px;">
                                Option A <span style="color: var(--bf-danger);">*</span>
                            </label>
                            <input type="text" name="optionA" th:value="${question.optionA}" required placeholder="Option A text"
                                   style="width: 100%; padding: 8px 12px; border: 1px solid var(--bf-slate-300); border-radius: var(--bf-radius-md, 8px); font-size: 0.875rem;" />
                        </div>
                        <div>
                            <label style="display: block; font-size: 0.8125rem; font-weight: 600; color: var(--bf-navy-800); margin-bottom: 4px;">
                                Option B <span style="color: var(--bf-danger);">*</span>
                            </label>
                            <input type="text" name="optionB" th:value="${question.optionB}" required placeholder="Option B text"
                                   style="width: 100%; padding: 8px 12px; border: 1px solid var(--bf-slate-300); border-radius: var(--bf-radius-md, 8px); font-size: 0.875rem;" />
                        </div>
                        <div>
                            <label style="display: block; font-size: 0.8125rem; font-weight: 600; color: var(--bf-navy-800); margin-bottom: 4px;">
                                Option C
                            </label>
                            <input type="text" name="optionC" th:value="${question.optionC}" placeholder="Option C text"
                                   style="width: 100%; padding: 8px 12px; border: 1px solid var(--bf-slate-300); border-radius: var(--bf-radius-md, 8px); font-size: 0.875rem;" />
                        </div>
                        <div>
                            <label style="display: block; font-size: 0.8125rem; font-weight: 600; color: var(--bf-navy-800); margin-bottom: 4px;">
                                Option D
                            </label>
                            <input type="text" name="optionD" th:value="${question.optionD}" placeholder="Option D text"
                                   style="width: 100%; padding: 8px 12px; border: 1px solid var(--bf-slate-300); border-radius: var(--bf-radius-md, 8px); font-size: 0.875rem;" />
                        </div>
                    </div>

                    <!-- Explanation -->
                    <div style="margin-bottom: 24px;">
                        <label style="display: block; font-size: 0.875rem; font-weight: 600; color: var(--bf-navy-800); margin-bottom: 6px;">
                            Solution / Step-by-Step Explanation
                        </label>
                        <textarea name="explanation" rows="4"
                                  placeholder="Explanation of the shortcut, mathematical formula, or logical reasoning..."
                                  style="width: 100%; padding: 10px 14px; border: 1px solid var(--bf-slate-300); border-radius: var(--bf-radius-md, 8px); font-size: 0.9375rem; resize: vertical;"
                                  th:text="${question.explanation}"></textarea>
                    </div>

                    <!-- Active Toggle -->
                    <div style="margin-bottom: 28px; display: flex; align-items: center; gap: 8px;">
                        <input type="checkbox" id="activeAptitude" name="active" value="true" th:checked="${question.isActive}" style="width: 18px; height: 18px; accent-color: var(--bf-primary);" />
                        <label for="activeAptitude" style="font-size: 0.875rem; color: var(--bf-navy-800); font-weight: 500; cursor: pointer;">
                            Active / Published (visible in aptitude tests)
                        </label>
                    </div>

                    <!-- Buttons -->
                    <div style="display: flex; gap: 12px; border-top: 1px solid var(--bf-slate-200); padding-top: 20px;">
                        <button type="submit" class="btn btn-primary" style="padding: 10px 24px;">Save Aptitude Question</button>
                        <a th:href="@{/admin/aptitude}" class="btn btn-ghost" style="padding: 10px 20px;">Cancel</a>
                    </div>
                </form>
            </div>
        </main>
    </div>
</div>

</body>
</html>
