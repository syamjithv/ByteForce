<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Manage Questions')}"></head>
<body>

<div class="app-layout">
    <aside th:replace="~{fragments/layout :: appSidebar('admin-questions')}"></aside>

    <div class="app-main">
        <header th:replace="~{admin/fragments :: adminTopbar('Manage Questions')}"></header>

        <main class="app-content" style="max-width: 1200px; margin: 0 auto; padding: 28px 24px;">
            <div th:replace="~{admin/fragments :: alerts}"></div>

            <div th:replace="~{admin/fragments :: adminHeader('Question Bank', 'Full repository of coding problems, technical MCQs, SQL challenges, and conceptual interview questions.', '/admin/questions/new', 'Add Question')}"></div>

            <!-- Filters & Search Bar -->
            <div class="card" style="background: var(--bf-white); border-radius: var(--bf-radius-lg, 12px); border: 1px solid var(--bf-slate-200); padding: 20px; margin-bottom: 24px;">
                <form th:action="@{/admin/questions}" method="get" style="display: flex; gap: 12px; flex-wrap: wrap; align-items: center;">
                    <!-- Keyword Search -->
                    <div style="flex: 2; min-width: 200px;">
                        <input type="text" name="q" th:value="${searchKeyword}" placeholder="Search questions by keyword..."
                               style="width: 100%; padding: 8px 12px; border: 1px solid var(--bf-slate-300); border-radius: var(--bf-radius-md, 8px); font-size: 0.875rem;" />
                    </div>

                    <!-- Topic Filter -->
                    <div style="flex: 1; min-width: 160px;">
                        <select name="topicId" style="width: 100%; padding: 8px 12px; border: 1px solid var(--bf-slate-300); border-radius: var(--bf-radius-md, 8px); font-size: 0.875rem; background: var(--bf-white);">
                            <option value="">All Topics</option>
                            <option th:each="t : ${topics}" th:value="${t.id}" th:text="${t.name}" th:selected="${selectedTopicId == t.id}"></option>
                        </select>
                    </div>

                    <!-- Difficulty Filter -->
                    <div style="flex: 1; min-width: 130px;">
                        <select name="difficulty" style="width: 100%; padding: 8px 12px; border: 1px solid var(--bf-slate-300); border-radius: var(--bf-radius-md, 8px); font-size: 0.875rem; background: var(--bf-white);">
                            <option value="">All Difficulties</option>
                            <option th:each="d : ${difficulties}" th:value="${d}" th:text="${d}" th:selected="${selectedDifficulty == d}"></option>
                        </select>
                    </div>

                    <!-- Question Type Filter -->
                    <div style="flex: 1; min-width: 130px;">
                        <select name="questionType" style="width: 100%; padding: 8px 12px; border: 1px solid var(--bf-slate-300); border-radius: var(--bf-radius-md, 8px); font-size: 0.875rem; background: var(--bf-white);">
                            <option value="">All Types</option>
                            <option th:each="qt : ${questionTypes}" th:value="${qt}" th:text="${qt}" th:selected="${selectedQuestionType == qt}"></option>
                        </select>
                    </div>

                    <button type="submit" class="btn btn-primary btn-sm" style="padding: 8px 18px;">Filter</button>
                    <a th:href="@{/admin/questions}" class="btn btn-ghost btn-sm" style="padding: 8px 12px;">Reset</a>
                </form>
            </div>

            <!-- Questions Table -->
            <div class="card" style="background: var(--bf-white); border-radius: var(--bf-radius-lg, 12px); border: 1px solid var(--bf-slate-200); overflow: hidden; box-shadow: var(--bf-shadow-sm);">
                <div style="overflow-x: auto;">
                    <table style="width: 100%; border-collapse: collapse; text-align: left; font-size: 0.875rem;">
                        <thead>
                            <tr style="background: var(--bf-slate-50); border-bottom: 1px solid var(--bf-slate-200); color: var(--bf-slate-500); font-weight: 600; text-transform: uppercase; font-size: 0.75rem; letter-spacing: 0.05em;">
                                <th style="padding: 14px 20px;">ID</th>
                                <th style="padding: 14px 20px;">Title</th>
                                <th style="padding: 14px 20px;">Topic</th>
                                <th style="padding: 14px 20px;">Difficulty</th>
                                <th style="padding: 14px 20px;">Type</th>
                                <th style="padding: 14px 20px; text-align: right;">Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:if="${questions.empty}">
                                <td colspan="6" style="padding: 32px 20px; text-align: center; color: var(--bf-slate-400);">No questions found matching your filter criteria.</td>
                            </tr>
                            <tr th:each="q : ${questions}" style="border-bottom: 1px solid var(--bf-slate-100); transition: background 0.15s;" onmouseover="this.style.background='var(--bf-slate-50)'" onmouseout="this.style.background='transparent'">
                                <td style="padding: 14px 20px; color: var(--bf-slate-400); font-weight: 600;" th:text="${q.id}">1</td>
                                <td style="padding: 14px 20px; font-weight: 600; color: var(--bf-navy-900);">
                                    <span th:text="${q.title}">Two Sum</span>
                                </td>
                                <td style="padding: 14px 20px;">
                                    <span class="badge" style="background: rgba(37, 99, 235, 0.1); color: var(--bf-primary); padding: 4px 8px; border-radius: 4px; font-weight: 600; font-size: 0.75rem;"
                                          th:text="${topicMap.get(q.topicId) != null ? topicMap.get(q.topicId).name : 'Topic #' + q.topicId}">Arrays</span>
                                </td>
                                <td style="padding: 14px 20px;">
                                    <span class="badge" th:classappend="${q.difficulty.name() == 'EASY' ? 'badge-success' : (q.difficulty.name() == 'MEDIUM' ? 'badge-warning' : 'badge-danger')}"
                                          style="padding: 4px 8px; border-radius: 4px; font-weight: 600; font-size: 0.75rem;" th:text="${q.difficulty}">EASY</span>
                                </td>
                                <td style="padding: 14px 20px;">
                                    <span class="badge" style="background: rgba(100, 116, 139, 0.1); color: var(--bf-slate-700); padding: 4px 8px; border-radius: 4px; font-weight: 600; font-size: 0.75rem;" th:text="${q.questionType}">CODING</span>
                                </td>
                                <td style="padding: 14px 20px; text-align: right; white-space: nowrap;">
                                    <div style="display: inline-flex; align-items: center; gap: 8px;">
                                        <a th:href="@{'/practice/' + ${q.slug}}" target="_blank" class="btn btn-outline btn-sm" style="padding: 4px 10px; font-size: 0.75rem;" title="View question in Practice workspace">Practice</a>
                                        <a th:href="@{'/admin/questions/' + ${q.id} + '/edit'}" class="btn btn-outline btn-sm" style="padding: 4px 10px; font-size: 0.75rem;">Edit</a>
                                        <form th:action="@{'/admin/questions/' + ${q.id} + '/delete'}" method="post" style="display: inline;" onsubmit="return confirm('Are you sure you want to delete this question?');">
                                            <button type="submit" class="btn btn-danger btn-sm" style="padding: 4px 10px; font-size: 0.75rem;">Delete</button>
                                        </form>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
</div>

</body>
</html>
