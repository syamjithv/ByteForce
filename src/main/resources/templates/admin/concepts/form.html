<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${pageTitle})}"></head>
<body>

<div class="app-layout">
    <aside th:replace="~{fragments/layout :: appSidebar('admin-concepts')}"></aside>

    <div class="app-main">
        <header th:replace="~{admin/fragments :: adminTopbar(${pageTitle})}"></header>

        <main class="app-content" style="max-width: 850px; margin: 0 auto; padding: 28px 24px;">
            <div th:replace="~{admin/fragments :: alerts}"></div>

            <div style="margin-bottom: 24px;">
                <a th:href="@{/admin/concepts}" style="color: var(--bf-slate-500); font-size: 0.875rem; display: inline-flex; align-items: center; gap: 4px; margin-bottom: 8px;">
                    ← Back to Concepts
                </a>
                <h2 style="font-size: 1.5rem; font-weight: 700; color: var(--bf-navy-900);" th:text="${isNew ? 'Create New Concept' : 'Edit Concept'}">Concept Form</h2>
            </div>

            <div class="card" style="background: var(--bf-white); border-radius: var(--bf-radius-lg, 12px); border: 1px solid var(--bf-slate-200); padding: 32px; box-shadow: var(--bf-shadow-sm);">
                <form th:action="@{/admin/concepts/save}" method="post">
                    <input type="hidden" name="id" th:value="${concept.id}" />

                    <!-- Associated Topic -->
                    <div style="margin-bottom: 20px;">
                        <label style="display: block; font-size: 0.875rem; font-weight: 600; color: var(--bf-navy-800); margin-bottom: 6px;">
                            Associated Topic <span style="color: var(--bf-danger);">*</span>
                        </label>
                        <select name="topicId" required style="width: 100%; padding: 10px 14px; border: 1px solid var(--bf-slate-300); border-radius: var(--bf-radius-md, 8px); font-size: 0.9375rem; background: var(--bf-white);">
                            <option value="">-- Select Topic --</option>
                            <option th:each="t : ${topics}" th:value="${t.id}" th:text="${t.name + ' (' + (t.subjectId != null ? t.subjectId : 'general') + ')'}" th:selected="${concept.topicId == t.id}"></option>
                        </select>
                    </div>

                    <!-- Concept Title -->
                    <div style="margin-bottom: 20px;">
                        <label style="display: block; font-size: 0.875rem; font-weight: 600; color: var(--bf-navy-800); margin-bottom: 6px;">
                            Concept Title <span style="color: var(--bf-danger);">*</span>
                        </label>
                        <input type="text" name="title" th:value="${concept.title}" required
                               placeholder="e.g. Sliding Window Technique"
                               style="width: 100%; padding: 10px 14px; border: 1px solid var(--bf-slate-300); border-radius: var(--bf-radius-md, 8px); font-size: 0.9375rem;" />
                    </div>

                    <!-- Short Explanation -->
                    <div style="margin-bottom: 20px;">
                        <label style="display: block; font-size: 0.875rem; font-weight: 600; color: var(--bf-navy-800); margin-bottom: 6px;">
                            Short Explanation <span style="color: var(--bf-danger);">*</span>
                        </label>
                        <textarea name="shortExplanation" rows="3" required
                                  placeholder="Concise summary explaining what the concept is and why it matters..."
                                  style="width: 100%; padding: 10px 14px; border: 1px solid var(--bf-slate-300); border-radius: var(--bf-radius-md, 8px); font-size: 0.9375rem; resize: vertical;"
                                  th:text="${concept.shortExplanation}"></textarea>
                    </div>

                    <!-- Key Points -->
                    <div style="margin-bottom: 20px;">
                        <label style="display: block; font-size: 0.875rem; font-weight: 600; color: var(--bf-navy-800); margin-bottom: 6px;">
                            Key Points (one per line)
                        </label>
                        <textarea name="keyPointsText" rows="5"
                                  placeholder="Direct O(1) random memory access&#10;Contiguous memory improves CPU cache locality&#10;Boundary conditions from 0 to length - 1"
                                  style="width: 100%; padding: 10px 14px; border: 1px solid var(--bf-slate-300); border-radius: var(--bf-radius-md, 8px); font-size: 0.9375rem; resize: vertical;"
                                  th:text="${keyPointsText}"></textarea>
                        <p style="font-size: 0.75rem; color: var(--bf-slate-500); margin-top: 4px;">Enter each bullet point on a separate line.</p>
                    </div>

                    <!-- Code Example / Implementation -->
                    <div style="margin-bottom: 28px;">
                        <label style="display: block; font-size: 0.875rem; font-weight: 600; color: var(--bf-navy-800); margin-bottom: 6px;">
                            Code Example / Pseudocode
                        </label>
                        <textarea name="example" rows="6"
                                  placeholder="// Code or syntax demonstration&#10;int[] arr = {1, 2, 3};"
                                  style="width: 100%; padding: 10px 14px; border: 1px solid var(--bf-slate-300); border-radius: var(--bf-radius-md, 8px); font-size: 0.875rem; font-family: var(--bf-font-mono); resize: vertical; background: var(--bf-slate-50);"
                                  th:text="${concept.example}"></textarea>
                    </div>

                    <!-- Buttons -->
                    <div style="display: flex; gap: 12px; border-top: 1px solid var(--bf-slate-200); padding-top: 20px;">
                        <button type="submit" class="btn btn-primary" style="padding: 10px 24px;">Save Concept</button>
                        <a th:href="@{/admin/concepts}" class="btn btn-ghost" style="padding: 10px 20px;">Cancel</a>
                    </div>
                </form>
            </div>
        </main>
    </div>
</div>

</body>
</html>
