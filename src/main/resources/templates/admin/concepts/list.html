<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Manage Concepts')}"></head>
<body>

<div class="app-layout">
    <aside th:replace="~{fragments/layout :: appSidebar('admin-concepts')}"></aside>

    <div class="app-main">
        <header th:replace="~{admin/fragments :: adminTopbar('Manage Concepts')}"></header>

        <main class="app-content" style="max-width: 1200px; margin: 0 auto; padding: 28px 24px;">
            <div th:replace="~{admin/fragments :: alerts}"></div>

            <div th:replace="~{admin/fragments :: adminHeader('Concepts', 'Individual computer science and placement preparation concepts with detailed explanations, key points, and examples.', '/admin/concepts/new', 'Add Concept')}"></div>

            <!-- Topic Filter Bar -->
            <div class="card" style="background: var(--bf-white); border-radius: var(--bf-radius-md, 8px); border: 1px solid var(--bf-slate-200); padding: 16px 20px; margin-bottom: 20px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap;">
                <span style="font-size: 0.875rem; font-weight: 600; color: var(--bf-navy-800);">Filter by Topic:</span>
                <div style="display: flex; gap: 8px; flex-wrap: wrap;">
                    <a th:href="@{/admin/concepts}" class="btn btn-sm" th:classappend="${selectedTopicId == null ? 'btn-primary' : 'btn-outline'}" style="padding: 4px 12px; font-size: 0.8125rem;">All Topics</a>
                    <a th:each="t : ${topics}" th:href="@{/admin/concepts(topicId=${t.id})}" class="btn btn-sm" th:classappend="${selectedTopicId == t.id ? 'btn-primary' : 'btn-outline'}" style="padding: 4px 12px; font-size: 0.8125rem;" th:text="${t.name}">Topic</a>
                </div>
            </div>

            <div class="card" style="background: var(--bf-white); border-radius: var(--bf-radius-lg, 12px); border: 1px solid var(--bf-slate-200); overflow: hidden; box-shadow: var(--bf-shadow-sm);">
                <div style="overflow-x: auto;">
                    <table style="width: 100%; border-collapse: collapse; text-align: left; font-size: 0.875rem;">
                        <thead>
                            <tr style="background: var(--bf-slate-50); border-bottom: 1px solid var(--bf-slate-200); color: var(--bf-slate-500); font-weight: 600; text-transform: uppercase; font-size: 0.75rem; letter-spacing: 0.05em;">
                                <th style="padding: 14px 20px;">ID</th>
                                <th style="padding: 14px 20px;">Concept Title</th>
                                <th style="padding: 14px 20px;">Topic</th>
                                <th style="padding: 14px 20px;">Explanation</th>
                                <th style="padding: 14px 20px;">Key Points</th>
                                <th style="padding: 14px 20px; text-align: right;">Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:if="${concepts.empty}">
                                <td colspan="6" style="padding: 32px 20px; text-align: center; color: var(--bf-slate-400);">No concepts found. Click "Add Concept" to create one.</td>
                            </tr>
                            <tr th:each="c : ${concepts}" style="border-bottom: 1px solid var(--bf-slate-100); transition: background 0.15s;" onmouseover="this.style.background='var(--bf-slate-50)'" onmouseout="this.style.background='transparent'">
                                <td style="padding: 14px 20px; color: var(--bf-slate-400); font-weight: 600;" th:text="${c.id}">1001</td>
                                <td style="padding: 14px 20px; font-weight: 600; color: var(--bf-navy-900);">
                                    <span th:text="${c.title}">Array Traversal</span>
                                </td>
                                <td style="padding: 14px 20px;">
                                    <span class="badge" style="background: rgba(16, 185, 129, 0.1); color: #059669; padding: 4px 8px; border-radius: 4px; font-weight: 600; font-size: 0.75rem;" th:text="${c.topicName != null && !c.topicName.isBlank() ? c.topicName : 'Topic #' + c.topicId}">Arrays</span>
                                </td>
                                <td style="padding: 14px 20px; color: var(--bf-slate-600); max-width: 320px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;" th:text="${c.shortExplanation}">Explanation...</td>
                                <td style="padding: 14px 20px; color: var(--bf-slate-500);" th:text="${c.keyPoints != null ? c.keyPoints.size() + ' points' : '0 points'}">4 points</td>
                                <td style="padding: 14px 20px; text-align: right; white-space: nowrap;">
                                    <div style="display: inline-flex; align-items: center; gap: 8px;">
                                        <a th:href="@{'/learn/concept/' + ${c.id}}" target="_blank" class="btn btn-outline btn-sm" style="padding: 4px 10px; font-size: 0.75rem;" title="View student-facing page">View</a>
                                        <a th:href="@{'/admin/remember?conceptId=' + ${c.id}}" class="btn btn-outline btn-sm" style="padding: 4px 10px; font-size: 0.75rem;" title="Manage Remember items for this concept">Remember</a>
                                        <a th:href="@{'/admin/concepts/' + ${c.id} + '/edit'}" class="btn btn-outline btn-sm" style="padding: 4px 10px; font-size: 0.75rem;">Edit</a>
                                        <form th:action="@{'/admin/concepts/' + ${c.id} + '/delete'}" method="post" style="display: inline;" onsubmit="return confirm('Are you sure you want to delete this concept?');">
                                            <button type="submit" class="btn btn-danger btn-sm" style="padding: 4px 10px; font-size: 0.75rem;">Delete</button>
                                        </form>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
</div>

</body>
</html>
