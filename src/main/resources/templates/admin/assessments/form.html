<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${pageTitle})}"></head>
<body>

<div class="app-layout">
    <aside th:replace="~{fragments/layout :: appSidebar('admin-assessments')}"></aside>

    <div class="app-main">
        <header th:replace="~{admin/fragments :: adminTopbar(${pageTitle})}"></header>

        <main class="app-content" style="max-width: 800px; margin: 0 auto; padding: 28px 24px;">
            <div th:replace="~{admin/fragments :: alerts}"></div>

            <div style="margin-bottom: 24px;">
                <a th:href="@{/admin/assessments}" style="color: var(--bf-slate-500); font-size: 0.875rem; display: inline-flex; align-items: center; gap: 4px; margin-bottom: 8px;">
                    ← Back to Assessments
                </a>
                <h2 style="font-size: 1.5rem; font-weight: 700; color: var(--bf-navy-900);" th:text="${isNew ? 'Create New Assessment' : 'Edit Assessment'}">Assessment Form</h2>
            </div>

            <div class="card" style="background: var(--bf-white); border-radius: var(--bf-radius-lg, 12px); border: 1px solid var(--bf-slate-200); padding: 32px; box-shadow: var(--bf-shadow-sm);">
                <form th:action="@{/admin/assessments/save}" method="post">
                    <input type="hidden" name="id" th:value="${assessment.id}" />

                    <!-- Title -->
                    <div style="margin-bottom: 20px;">
                        <label style="display: block; font-size: 0.875rem; font-weight: 600; color: var(--bf-navy-800); margin-bottom: 6px;">
                            Assessment Title <span style="color: var(--bf-danger);">*</span>
                        </label>
                        <input type="text" name="title" th:value="${assessment.title}" required
                               placeholder="e.g. CS Fundamentals Diagnostic Mock 2"
                               style="width: 100%; padding: 10px 14px; border: 1px solid var(--bf-slate-300); border-radius: var(--bf-radius-md, 8px); font-size: 0.9375rem;" />
                    </div>

                    <!-- Description -->
                    <div style="margin-bottom: 20px;">
                        <label style="display: block; font-size: 0.875rem; font-weight: 600; color: var(--bf-navy-800); margin-bottom: 6px;">
                            Description / Instructions
                        </label>
                        <textarea name="description" rows="3"
                                  placeholder="Placement evaluation scope, topic coverage, and scoring instructions..."
                                  style="width: 100%; padding: 10px 14px; border: 1px solid var(--bf-slate-300); border-radius: var(--bf-radius-md, 8px); font-size: 0.9375rem; resize: vertical;"
                                  th:text="${assessment.description}"></textarea>
                    </div>

                    <!-- Row: Duration & Total Marks -->
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px;">
                        <div>
                            <label style="display: block; font-size: 0.875rem; font-weight: 600; color: var(--bf-navy-800); margin-bottom: 6px;">
                                Duration (Minutes) <span style="color: var(--bf-danger);">*</span>
                            </label>
                            <input type="number" name="durationMinutes" th:value="${assessment.durationMinutes}" required min="1"
                                   style="width: 100%; padding: 10px 14px; border: 1px solid var(--bf-slate-300); border-radius: var(--bf-radius-md, 8px); font-size: 0.9375rem;" />
                        </div>
                        <div>
                            <label style="display: block; font-size: 0.875rem; font-weight: 600; color: var(--bf-navy-800); margin-bottom: 6px;">
                                Total Marks <span style="color: var(--bf-danger);">*</span>
                            </label>
                            <input type="number" name="totalMarks" th:value="${assessment.totalMarks}" required min="1"
                                   style="width: 100%; padding: 10px 14px; border: 1px solid var(--bf-slate-300); border-radius: var(--bf-radius-md, 8px); font-size: 0.9375rem;" />
                        </div>
                    </div>

                    <!-- Row: Difficulty & Topic -->
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px;">
                        <div>
                            <label style="display: block; font-size: 0.875rem; font-weight: 600; color: var(--bf-navy-800); margin-bottom: 6px;">
                                Difficulty <span style="color: var(--bf-danger);">*</span>
                            </label>
                            <select name="difficulty" required style="width: 100%; padding: 10px 14px; border: 1px solid var(--bf-slate-300); border-radius: var(--bf-radius-md, 8px); font-size: 0.9375rem; background: var(--bf-white);">
                                <option th:each="d : ${difficulties}" th:value="${d}" th:text="${d}" th:selected="${assessment.difficulty == d}"></option>
                            </select>
                        </div>
                        <div>
                            <label style="display: block; font-size: 0.875rem; font-weight: 600; color: var(--bf-navy-800); margin-bottom: 6px;">
                                Primary Topic (Optional)
                            </label>
                            <select name="topicId" style="width: 100%; padding: 10px 14px; border: 1px solid var(--bf-slate-300); border-radius: var(--bf-radius-md, 8px); font-size: 0.9375rem; background: var(--bf-white);">
                                <option value="">Comprehensive / Multi-Topic</option>
                                <option th:each="t : ${topics}" th:value="${t.id}" th:text="${t.name}" th:selected="${assessment.topicId == t.id}"></option>
                            </select>
                        </div>
                    </div>

                    <!-- Active Toggle -->
                    <div style="margin-bottom: 28px; display: flex; align-items: center; gap: 8px;">
                        <input type="checkbox" id="activeAssessment" name="active" value="true" th:checked="${assessment.isActive}" style="width: 18px; height: 18px; accent-color: var(--bf-primary);" />
                        <label for="activeAssessment" style="font-size: 0.875rem; color: var(--bf-navy-800); font-weight: 500; cursor: pointer;">
                            Active (available for students to start on the Assessments page)
                        </label>
                    </div>

                    <!-- Buttons -->
                    <div style="display: flex; gap: 12px; border-top: 1px solid var(--bf-slate-200); padding-top: 20px;">
                        <button type="submit" class="btn btn-primary" style="padding: 10px 24px;" th:text="${isNew ? 'Save & Assign Questions →' : 'Save Changes'}">Save Assessment</button>
                        <a th:href="@{/admin/assessments}" class="btn btn-ghost" style="padding: 10px 20px;">Cancel</a>
                    </div>
                </form>
            </div>
        </main>
    </div>
</div>

</body>
</html>
