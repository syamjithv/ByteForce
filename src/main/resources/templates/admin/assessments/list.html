<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Manage Assessments')}"></head>
<body>

<div class="app-layout">
    <aside th:replace="~{fragments/layout :: appSidebar('admin-assessments')}"></aside>

    <div class="app-main">
        <header th:replace="~{admin/fragments :: adminTopbar('Manage Assessments')}"></header>

        <main class="app-content" style="max-width: 1200px; margin: 0 auto; padding: 28px 24px;">
            <div th:replace="~{admin/fragments :: alerts}"></div>

            <div th:replace="~{admin/fragments :: adminHeader('Assessments & Mock Tests', 'Timed diagnostic assessments, topic tests, and company readiness mock exams.', '/admin/assessments/new', 'Create Assessment')}"></div>

            <div class="card" style="background: var(--bf-white); border-radius: var(--bf-radius-lg, 12px); border: 1px solid var(--bf-slate-200); overflow: hidden; box-shadow: var(--bf-shadow-sm);">
                <div style="overflow-x: auto;">
                    <table style="width: 100%; border-collapse: collapse; text-align: left; font-size: 0.875rem;">
                        <thead>
                            <tr style="background: var(--bf-slate-50); border-bottom: 1px solid var(--bf-slate-200); color: var(--bf-slate-500); font-weight: 600; text-transform: uppercase; font-size: 0.75rem; letter-spacing: 0.05em;">
                                <th style="padding: 14px 20px;">ID</th>
                                <th style="padding: 14px 20px;">Title</th>
                                <th style="padding: 14px 20px;">Topic</th>
                                <th style="padding: 14px 20px;">Duration</th>
                                <th style="padding: 14px 20px;">Total Marks</th>
                                <th style="padding: 14px 20px;">Difficulty</th>
                                <th style="padding: 14px 20px;">Status</th>
                                <th style="padding: 14px 20px; text-align: right;">Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:if="${assessments.empty}">
                                <td colspan="8" style="padding: 32px 20px; text-align: center; color: var(--bf-slate-400);">No assessments found. Click "Create Assessment" to build one.</td>
                            </tr>
                            <tr th:each="a : ${assessments}" style="border-bottom: 1px solid var(--bf-slate-100); transition: background 0.15s;" onmouseover="this.style.background='var(--bf-slate-50)'" onmouseout="this.style.background='transparent'">
                                <td style="padding: 14px 20px; color: var(--bf-slate-400); font-weight: 600;" th:text="${a.id}">1</td>
                                <td style="padding: 14px 20px; font-weight: 600; color: var(--bf-navy-900);">
                                    <span th:text="${a.title}">Technical Placement Readiness Mock Test 1</span>
                                </td>
                                <td style="padding: 14px 20px;">
                                    <span class="badge" style="background: rgba(37, 99, 235, 0.1); color: var(--bf-primary); padding: 4px 8px; border-radius: 4px; font-weight: 600; font-size: 0.75rem;"
                                          th:text="${a.topicId != null && topicMap.get(a.topicId) != null ? topicMap.get(a.topicId) : 'Comprehensive'}">DSA</span>
                                </td>
                                <td style="padding: 14px 20px; color: var(--bf-slate-700);" th:text="${a.durationMinutes + ' mins'}">45 mins</td>
                                <td style="padding: 14px 20px; color: var(--bf-slate-700); font-weight: 600;" th:text="${a.totalMarks + ' pts'}">50 pts</td>
                                <td style="padding: 14px 20px;">
                                    <span class="badge" th:classappend="${a.difficulty.name() == 'EASY' ? 'badge-success' : (a.difficulty.name() == 'MEDIUM' ? 'badge-warning' : 'badge-danger')}"
                                          style="padding: 4px 8px; border-radius: 4px; font-weight: 600; font-size: 0.75rem;" th:text="${a.difficulty}">MEDIUM</span>
                                </td>
                                <td style="padding: 14px 20px;">
                                    <span th:if="${a.isActive}" class="badge badge-success" style="padding: 4px 8px; border-radius: 4px; font-weight: 600; font-size: 0.75rem;">ACTIVE</span>
                                    <span th:if="${!a.isActive}" class="badge" style="background: var(--bf-slate-100); color: var(--bf-slate-500); padding: 4px 8px; border-radius: 4px; font-weight: 600; font-size: 0.75rem;">INACTIVE</span>
                                </td>
                                <td style="padding: 14px 20px; text-align: right; white-space: nowrap;">
                                    <div style="display: inline-flex; align-items: center; gap: 8px;">
                                        <a th:href="@{'/admin/assessments/' + ${a.id} + '/questions'}" class="btn btn-primary btn-sm" style="padding: 4px 10px; font-size: 0.75rem;" title="Manage questions assigned to this assessment">Questions</a>
                                        <a th:href="@{'/assessments/' + ${a.id}}" target="_blank" class="btn btn-outline btn-sm" style="padding: 4px 10px; font-size: 0.75rem;" title="View student-facing preview">View</a>
                                        <a th:href="@{'/admin/assessments/' + ${a.id} + '/edit'}" class="btn btn-outline btn-sm" style="padding: 4px 10px; font-size: 0.75rem;">Edit</a>
                                        <form th:action="@{'/admin/assessments/' + ${a.id} + '/delete'}" method="post" style="display: inline;" onsubmit="return confirm('Are you sure you want to delete this assessment?');">
                                            <button type="submit" class="btn btn-danger btn-sm" style="padding: 4px 10px; font-size: 0.75rem;">Delete</button>
                                        </form>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
</div>

</body>
</html>
