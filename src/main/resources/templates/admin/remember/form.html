<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${pageTitle})}"></head>
<body>

<div class="app-layout">
    <aside th:replace="~{fragments/layout :: appSidebar('admin-remember')}"></aside>

    <div class="app-main">
        <header th:replace="~{admin/fragments :: adminTopbar(${pageTitle})}"></header>

        <main class="app-content" style="max-width: 800px; margin: 0 auto; padding: 28px 24px;">
            <div th:replace="~{admin/fragments :: alerts}"></div>

            <div style="margin-bottom: 24px;">
                <a th:href="@{/admin/remember}" style="color: var(--bf-slate-500); font-size: 0.875rem; display: inline-flex; align-items: center; gap: 4px; margin-bottom: 8px;">
                    ← Back to Remember Items
                </a>
                <h2 style="font-size: 1.5rem; font-weight: 700; color: var(--bf-navy-900);" th:text="${isNew ? 'Create Remember Item' : 'Edit Remember Item'}">Remember Form</h2>
            </div>

            <div class="card" style="background: var(--bf-white); border-radius: var(--bf-radius-lg, 12px); border: 1px solid var(--bf-slate-200); padding: 32px; box-shadow: var(--bf-shadow-sm);">
                <form th:action="@{/admin/remember/save}" method="post">
                    <input type="hidden" name="id" th:value="${item.id}" />

                    <!-- Associated Concept -->
                    <div style="margin-bottom: 20px;">
                        <label style="display: block; font-size: 0.875rem; font-weight: 600; color: var(--bf-navy-800); margin-bottom: 6px;">
                            Associated Concept <span style="color: var(--bf-danger);">*</span>
                        </label>
                        <select name="conceptId" required style="width: 100%; padding: 10px 14px; border: 1px solid var(--bf-slate-300); border-radius: var(--bf-radius-md, 8px); font-size: 0.9375rem; background: var(--bf-white);">
                            <option value="">-- Select Concept --</option>
                            <option th:each="c : ${concepts}" th:value="${c.id}" th:text="${c.title + ' (#' + c.id + ')'}" th:selected="${item.conceptId == c.id}"></option>
                        </select>
                    </div>

                    <!-- Type -->
                    <div style="margin-bottom: 20px;">
                        <label style="display: block; font-size: 0.875rem; font-weight: 600; color: var(--bf-navy-800); margin-bottom: 6px;">
                            Remember Item Type <span style="color: var(--bf-danger);">*</span>
                        </label>
                        <select name="type" required style="width: 100%; padding: 10px 14px; border: 1px solid var(--bf-slate-300); border-radius: var(--bf-radius-md, 8px); font-size: 0.9375rem; background: var(--bf-white);">
                            <option th:each="t : ${itemTypes}" th:value="${t}" th:text="${t}" th:selected="${item.type == t}"></option>
                        </select>
                    </div>

                    <!-- Content -->
                    <div style="margin-bottom: 20px;">
                        <label style="display: block; font-size: 0.875rem; font-weight: 600; color: var(--bf-navy-800); margin-bottom: 6px;">
                            Item Content / Hook <span style="color: var(--bf-danger);">*</span>
                        </label>
                        <textarea name="content" rows="4" required
                                  placeholder="Concise, memorable sentence or formula to quickly trigger recall..."
                                  style="width: 100%; padding: 10px 14px; border: 1px solid var(--bf-slate-300); border-radius: var(--bf-radius-md, 8px); font-size: 0.9375rem; resize: vertical;"
                                  th:text="${item.content}"></textarea>
                    </div>

                    <!-- Display Order -->
                    <div style="margin-bottom: 20px;">
                        <label style="display: block; font-size: 0.875rem; font-weight: 600; color: var(--bf-navy-800); margin-bottom: 6px;">
                            Display Order
                        </label>
                        <input type="number" name="displayOrder" th:value="${item.displayOrder}"
                               style="width: 140px; padding: 10px 14px; border: 1px solid var(--bf-slate-300); border-radius: var(--bf-radius-md, 8px); font-size: 0.9375rem;" />
                    </div>

                    <!-- Active Toggle -->
                    <div style="margin-bottom: 28px; display: flex; align-items: center; gap: 8px;">
                        <input type="checkbox" id="activeToggle" name="active" value="true" th:checked="${item.isActive}" style="width: 18px; height: 18px; accent-color: var(--bf-primary);" />
                        <label for="activeToggle" style="font-size: 0.875rem; color: var(--bf-navy-800); font-weight: 500; cursor: pointer;">
                            Active (visible to students on concept page)
                        </label>
                    </div>

                    <!-- Buttons -->
                    <div style="display: flex; gap: 12px; border-top: 1px solid var(--bf-slate-200); padding-top: 20px;">
                        <button type="submit" class="btn btn-primary" style="padding: 10px 24px;">Save Remember Item</button>
                        <a th:href="@{/admin/remember}" class="btn btn-ghost" style="padding: 10px 20px;">Cancel</a>
                    </div>
                </form>
            </div>
        </main>
    </div>
</div>

</body>
</html>
