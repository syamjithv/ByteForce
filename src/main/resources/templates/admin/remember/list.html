<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Manage Remember Items')}"></head>
<body>

<div class="app-layout">
    <aside th:replace="~{fragments/layout :: appSidebar('admin-remember')}"></aside>

    <div class="app-main">
        <header th:replace="~{admin/fragments :: adminTopbar('Manage Remember Items')}"></header>

        <main class="app-content" style="max-width: 1200px; margin: 0 auto; padding: 28px 24px;">
            <div th:replace="~{admin/fragments :: alerts}"></div>

            <div th:replace="~{admin/fragments :: adminHeader('Remember Items', 'Rapid retention hooks, interview traps, memory tricks, and formulas attached to concepts.', '/admin/remember/new', 'Add Remember Item')}"></div>

            <!-- Filter Bar -->
            <div class="card" style="background: var(--bf-white); border-radius: var(--bf-radius-md, 8px); border: 1px solid var(--bf-slate-200); padding: 16px 20px; margin-bottom: 20px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap;">
                <span style="font-size: 0.875rem; font-weight: 600; color: var(--bf-navy-800);">Filter by Type:</span>
                <div style="display: flex; gap: 8px; flex-wrap: wrap;">
                    <a th:href="@{/admin/remember}" class="btn btn-sm" th:classappend="${selectedType == null ? 'btn-primary' : 'btn-outline'}" style="padding: 4px 12px; font-size: 0.8125rem;">All Types</a>
                    <a th:each="t : ${itemTypes}" th:href="@{/admin/remember(type=${t})}" class="btn btn-sm" th:classappend="${selectedType == t ? 'btn-primary' : 'btn-outline'}" style="padding: 4px 12px; font-size: 0.8125rem;" th:text="${t}">KEY_FACT</a>
                </div>
            </div>

            <div class="card" style="background: var(--bf-white); border-radius: var(--bf-radius-lg, 12px); border: 1px solid var(--bf-slate-200); overflow: hidden; box-shadow: var(--bf-shadow-sm);">
                <div style="overflow-x: auto;">
                    <table style="width: 100%; border-collapse: collapse; text-align: left; font-size: 0.875rem;">
                        <thead>
                            <tr style="background: var(--bf-slate-50); border-bottom: 1px solid var(--bf-slate-200); color: var(--bf-slate-500); font-weight: 600; text-transform: uppercase; font-size: 0.75rem; letter-spacing: 0.05em;">
                                <th style="padding: 14px 20px;">ID</th>
                                <th style="padding: 14px 20px;">Concept</th>
                                <th style="padding: 14px 20px;">Type</th>
                                <th style="padding: 14px 20px;">Content</th>
                                <th style="padding: 14px 20px;">Order</th>
                                <th style="padding: 14px 20px; text-align: right;">Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:if="${items.empty}">
                                <td colspan="6" style="padding: 32px 20px; text-align: center; color: var(--bf-slate-400);">No Remember items found. Click "Add Remember Item" to create one.</td>
                            </tr>
                            <tr th:each="i : ${items}" style="border-bottom: 1px solid var(--bf-slate-100); transition: background 0.15s;" onmouseover="this.style.background='var(--bf-slate-50)'" onmouseout="this.style.background='transparent'">
                                <td style="padding: 14px 20px; color: var(--bf-slate-400); font-weight: 600;" th:text="${i.id}">1</td>
                                <td style="padding: 14px 20px; font-weight: 600; color: var(--bf-navy-900);">
                                    <span th:text="${'Concept #' + i.conceptId}">Concept #1001</span>
                                </td>
                                <td style="padding: 14px 20px;">
                                    <span class="badge" style="background: rgba(6, 182, 212, 0.1); color: #0891b2; padding: 4px 8px; border-radius: 4px; font-weight: 600; font-size: 0.75rem;" th:text="${i.type}">KEY_FACT</span>
                                </td>
                                <td style="padding: 14px 20px; color: var(--bf-slate-700); max-width: 380px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;" th:text="${i.content}">Array index access is O(1)...</td>
                                <td style="padding: 14px 20px; color: var(--bf-slate-500);" th:text="${i.displayOrder}">1</td>
                                <td style="padding: 14px 20px; text-align: right; white-space: nowrap;">
                                    <div style="display: inline-flex; align-items: center; gap: 8px;">
                                        <a th:href="@{'/admin/remember/' + ${i.id} + '/edit'}" class="btn btn-outline btn-sm" style="padding: 4px 10px; font-size: 0.75rem;">Edit</a>
                                        <form th:action="@{'/admin/remember/' + ${i.id} + '/delete'}" method="post" style="display: inline;" onsubmit="return confirm('Are you sure you want to delete this Remember item?');">
                                            <button type="submit" class="btn btn-danger btn-sm" style="padding: 4px 10px; font-size: 0.75rem;">Delete</button>
                                        </form>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
</div>

</body>
</html>
