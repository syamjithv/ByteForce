<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Manage Learning Resources')}"></head>
<body>

<div class="app-layout">
    <aside th:replace="~{fragments/layout :: appSidebar('admin-resources')}"></aside>

    <div class="app-main">
        <header th:replace="~{admin/fragments :: adminTopbar('Manage Learning Resources')}"></header>

        <main class="app-content" style="max-width: 1200px; margin: 0 auto; padding: 28px 24px;">
            <div th:replace="~{admin/fragments :: alerts}"></div>

            <div th:replace="~{admin/fragments :: adminHeader('Learning Resources', 'External articles, official documentation, videos, and PDFs attached to CS concepts.', '/admin/resources/new', 'Add Resource')}"></div>

            <div class="card" style="background: var(--bf-white); border-radius: var(--bf-radius-lg, 12px); border: 1px solid var(--bf-slate-200); overflow: hidden; box-shadow: var(--bf-shadow-sm);">
                <div style="overflow-x: auto;">
                    <table style="width: 100%; border-collapse: collapse; text-align: left; font-size: 0.875rem;">
                        <thead>
                            <tr style="background: var(--bf-slate-50); border-bottom: 1px solid var(--bf-slate-200); color: var(--bf-slate-500); font-weight: 600; text-transform: uppercase; font-size: 0.75rem; letter-spacing: 0.05em;">
                                <th style="padding: 14px 20px;">ID</th>
                                <th style="padding: 14px 20px;">Resource Title</th>
                                <th style="padding: 14px 20px;">Type</th>
                                <th style="padding: 14px 20px;">Concept</th>
                                <th style="padding: 14px 20px;">URL</th>
                                <th style="padding: 14px 20px; text-align: right;">Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:if="${resources.empty}">
                                <td colspan="6" style="padding: 32px 20px; text-align: center; color: var(--bf-slate-400);">No resources found. Click "Add Resource" to create one.</td>
                            </tr>
                            <tr th:each="r : ${resources}" style="border-bottom: 1px solid var(--bf-slate-100); transition: background 0.15s;" onmouseover="this.style.background='var(--bf-slate-50)'" onmouseout="this.style.background='transparent'">
                                <td style="padding: 14px 20px; color: var(--bf-slate-400); font-weight: 600;" th:text="${r.id}">1</td>
                                <td style="padding: 14px 20px; font-weight: 600; color: var(--bf-navy-900);">
                                    <span th:text="${r.title}">Array Data Structure Guide</span>
                                </td>
                                <td style="padding: 14px 20px;">
                                    <span class="badge" style="background: rgba(139, 92, 246, 0.1); color: #7c3aed; padding: 4px 8px; border-radius: 4px; font-weight: 600; font-size: 0.75rem;" th:text="${r.resourceType}">ARTICLE</span>
                                </td>
                                <td style="padding: 14px 20px; color: var(--bf-slate-700);">
                                    <span th:text="${'Concept #' + r.conceptId}">Concept #1001</span>
                                </td>
                                <td style="padding: 14px 20px; max-width: 240px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">
                                    <a th:href="${r.url}" target="_blank" rel="noopener noreferrer" style="color: var(--bf-primary); font-size: 0.8125rem;" th:text="${r.url}">https://...</a>
                                </td>
                                <td style="padding: 14px 20px; text-align: right; white-space: nowrap;">
                                    <div style="display: inline-flex; align-items: center; gap: 8px;">
                                        <a th:href="@{'/admin/resources/' + ${r.id} + '/edit'}" class="btn btn-outline btn-sm" style="padding: 4px 10px; font-size: 0.75rem;">Edit</a>
                                        <form th:action="@{'/admin/resources/' + ${r.id} + '/delete'}" method="post" style="display: inline;" onsubmit="return confirm('Are you sure you want to delete this resource?');">
                                            <button type="submit" class="btn btn-danger btn-sm" style="padding: 4px 10px; font-size: 0.75rem;">Delete</button>
                                        </form>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
</div>

</body>
</html>
