<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${pageTitle})}"></head>
<body>

<div class="app-layout">
    <aside th:replace="~{fragments/layout :: appSidebar('admin-brain-maps')}"></aside>

    <div class="app-main">
        <header th:replace="~{admin/fragments :: adminTopbar(${pageTitle})}"></header>

        <main class="app-content" style="max-width: 800px; margin: 0 auto; padding: 28px 24px;">
            <div th:replace="~{admin/fragments :: alerts}"></div>

            <div style="margin-bottom: 24px;">
                <a th:href="@{/admin/brain-maps}" style="color: var(--bf-slate-500); font-size: 0.875rem; display: inline-flex; align-items: center; gap: 4px; margin-bottom: 8px;">
                    ← Back to Brain Maps
                </a>
                <h2 style="font-size: 1.5rem; font-weight: 700; color: var(--bf-navy-900);" th:text="${isNew ? 'Create Concept Relationship' : 'Edit Concept Relationship'}">Relationship Form</h2>
            </div>

            <div class="card" style="background: var(--bf-white); border-radius: var(--bf-radius-lg, 12px); border: 1px solid var(--bf-slate-200); padding: 32px; box-shadow: var(--bf-shadow-sm);">
                <form th:action="@{/admin/brain-maps/save}" method="post">
                    <input type="hidden" name="id" th:value="${relationship.id}" />

                    <!-- Source Concept -->
                    <div style="margin-bottom: 20px;">
                        <label style="display: block; font-size: 0.875rem; font-weight: 600; color: var(--bf-navy-800); margin-bottom: 6px;">
                            Source Concept (From) <span style="color: var(--bf-danger);">*</span>
                        </label>
                        <select name="sourceConceptId" required style="width: 100%; padding: 10px 14px; border: 1px solid var(--bf-slate-300); border-radius: var(--bf-radius-md, 8px); font-size: 0.9375rem; background: var(--bf-white);">
                            <option value="">-- Select Source Concept --</option>
                            <option th:each="c : ${concepts}" th:value="${c.id}" th:text="${c.title + ' (#' + c.id + ')'}" th:selected="${relationship.sourceConceptId == c.id}"></option>
                        </select>
                    </div>

                    <!-- Type -->
                    <div style="margin-bottom: 20px;">
                        <label style="display: block; font-size: 0.875rem; font-weight: 600; color: var(--bf-navy-800); margin-bottom: 6px;">
                            Relationship Type <span style="color: var(--bf-danger);">*</span>
                        </label>
                        <select name="type" required style="width: 100%; padding: 10px 14px; border: 1px solid var(--bf-slate-300); border-radius: var(--bf-radius-md, 8px); font-size: 0.9375rem; background: var(--bf-white);">
                            <option th:each="t : ${relationshipTypes}" th:value="${t}" th:text="${t}" th:selected="${relationship.relationshipType == t}"></option>
                        </select>
                        <p style="font-size: 0.75rem; color: var(--bf-slate-500); margin-top: 4px;">e.g. PREREQUISITE means Source must be studied before Target.</p>
                    </div>

                    <!-- Target Concept -->
                    <div style="margin-bottom: 20px;">
                        <label style="display: block; font-size: 0.875rem; font-weight: 600; color: var(--bf-navy-800); margin-bottom: 6px;">
                            Target Concept (To) <span style="color: var(--bf-danger);">*</span>
                        </label>
                        <select name="targetConceptId" required style="width: 100%; padding: 10px 14px; border: 1px solid var(--bf-slate-300); border-radius: var(--bf-radius-md, 8px); font-size: 0.9375rem; background: var(--bf-white);">
                            <option value="">-- Select Target Concept --</option>
                            <option th:each="c : ${concepts}" th:value="${c.id}" th:text="${c.title + ' (#' + c.id + ')'}" th:selected="${relationship.targetConceptId == c.id}"></option>
                        </select>
                    </div>

                    <!-- Description -->
                    <div style="margin-bottom: 20px;">
                        <label style="display: block; font-size: 0.875rem; font-weight: 600; color: var(--bf-navy-800); margin-bottom: 6px;">
                            Pedagogical Description
                        </label>
                        <textarea name="description" rows="3" placeholder="Explain why these concepts are linked (e.g. Array indexing is required to build prefix sum arrays)..."
                                  style="width: 100%; padding: 10px 14px; border: 1px solid var(--bf-slate-300); border-radius: var(--bf-radius-md, 8px); font-size: 0.9375rem; resize: vertical;"
                                  th:text="${relationship.description}"></textarea>
                    </div>

                    <!-- Display Order -->
                    <div style="margin-bottom: 28px;">
                        <label style="display: block; font-size: 0.875rem; font-weight: 600; color: var(--bf-navy-800); margin-bottom: 6px;">
                            Display Order
                        </label>
                        <input type="number" name="displayOrder" th:value="${relationship.displayOrder}"
                               style="width: 140px; padding: 10px 14px; border: 1px solid var(--bf-slate-300); border-radius: var(--bf-radius-md, 8px); font-size: 0.9375rem;" />
                    </div>

                    <!-- Buttons -->
                    <div style="display: flex; gap: 12px; border-top: 1px solid var(--bf-slate-200); padding-top: 20px;">
                        <button type="submit" class="btn btn-primary" style="padding: 10px 24px;">Save Relationship</button>
                        <a th:href="@{/admin/brain-maps}" class="btn btn-ghost" style="padding: 10px 20px;">Cancel</a>
                    </div>
                </form>
            </div>
        </main>
    </div>
</div>

</body>
</html>
