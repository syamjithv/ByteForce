<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Manage Brain Map Relationships')}"></head>
<body>

<div class="app-layout">
    <aside th:replace="~{fragments/layout :: appSidebar('admin-brain-maps')}"></aside>

    <div class="app-main">
        <header th:replace="~{admin/fragments :: adminTopbar('Manage Brain Map Relationships')}"></header>

        <main class="app-content" style="max-width: 1200px; margin: 0 auto; padding: 28px 24px;">
            <div th:replace="~{admin/fragments :: alerts}"></div>

            <div th:replace="~{admin/fragments :: adminHeader('Brain Map Relationships', 'Directed connections between concepts (prerequisites, related topics, and common confusions).', '/admin/brain-maps/new', 'Add Relationship')}"></div>

            <div class="card" style="background: var(--bf-white); border-radius: var(--bf-radius-lg, 12px); border: 1px solid var(--bf-slate-200); overflow: hidden; box-shadow: var(--bf-shadow-sm);">
                <div style="overflow-x: auto;">
                    <table style="width: 100%; border-collapse: collapse; text-align: left; font-size: 0.875rem;">
                        <thead>
                            <tr style="background: var(--bf-slate-50); border-bottom: 1px solid var(--bf-slate-200); color: var(--bf-slate-500); font-weight: 600; text-transform: uppercase; font-size: 0.75rem; letter-spacing: 0.05em;">
                                <th style="padding: 14px 20px;">ID</th>
                                <th style="padding: 14px 20px;">Source Concept</th>
                                <th style="padding: 14px 20px;">Relationship Type</th>
                                <th style="padding: 14px 20px;">Target Concept</th>
                                <th style="padding: 14px 20px;">Description</th>
                                <th style="padding: 14px 20px; text-align: right;">Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:if="${relationships.empty}">
                                <td colspan="6" style="padding: 32px 20px; text-align: center; color: var(--bf-slate-400);">No relationships found. Click "Add Relationship" to connect concepts.</td>
                            </tr>
                            <tr th:each="r : ${relationships}" style="border-bottom: 1px solid var(--bf-slate-100); transition: background 0.15s;" onmouseover="this.style.background='var(--bf-slate-50)'" onmouseout="this.style.background='transparent'">
                                <td style="padding: 14px 20px; color: var(--bf-slate-400); font-weight: 600;" th:text="${r.id}">1</td>
                                <td style="padding: 14px 20px; font-weight: 600; color: var(--bf-navy-900);">
                                    <span th:text="${conceptMap.get(r.sourceConceptId) != null ? conceptMap.get(r.sourceConceptId).title : 'Concept #' + r.sourceConceptId}">Source Concept</span>
                                </td>
                                <td style="padding: 14px 20px;">
                                    <span class="badge" style="background: rgba(236, 72, 153, 0.1); color: #db2777; padding: 4px 8px; border-radius: 4px; font-weight: 600; font-size: 0.75rem;" th:text="${r.relationshipType}">PREREQUISITE</span>
                                </td>
                                <td style="padding: 14px 20px; font-weight: 600; color: var(--bf-navy-900);">
                                    <span th:text="${conceptMap.get(r.targetConceptId) != null ? conceptMap.get(r.targetConceptId).title : 'Concept #' + r.targetConceptId}">Target Concept</span>
                                </td>
                                <td style="padding: 14px 20px; color: var(--bf-slate-600); max-width: 320px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;" th:text="${r.description}">Relationship description...</td>
                                <td style="padding: 14px 20px; text-align: right; white-space: nowrap;">
                                    <div style="display: inline-flex; align-items: center; gap: 8px;">
                                        <a th:href="@{'/admin/brain-maps/' + ${r.id} + '/edit'}" class="btn btn-outline btn-sm" style="padding: 4px 10px; font-size: 0.75rem;">Edit</a>
                                        <form th:action="@{'/admin/brain-maps/' + ${r.id} + '/delete'}" method="post" style="display: inline;" onsubmit="return confirm('Are you sure you want to delete this relationship?');">
                                            <button type="submit" class="btn btn-danger btn-sm" style="padding: 4px 10px; font-size: 0.75rem;">Delete</button>
                                        </form>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
</div>

</body>
</html>
