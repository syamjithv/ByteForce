<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Resource Not Found (404)')}"></head>
<body>

<!-- Authenticated Application Shell -->
<div th:if="${currentUser != null}" class="app-layout">
    <aside th:replace="~{fragments/layout :: appSidebar('')}"></aside>
    <div class="app-main">
        <header th:replace="~{fragments/layout :: appTopbar('Page Not Found')}"></header>
        <main class="app-content">
            <div class="card" style="max-width: 600px; margin: 40px auto; text-align: center; padding: 40px 24px;">
                <div style="font-size: 3rem; font-weight: 800; color: var(--bf-primary); margin-bottom: 12px;">404</div>
                <h1 style="font-size: 1.5rem; margin-bottom: 12px; color: var(--bf-navy-900);">Resource Not Found</h1>
                <p style="color: var(--bf-slate-600); margin-bottom: 24px; font-size: 1rem;"
                   th:text="${errorMessage != null ? errorMessage : 'The concept, topic, or page you are looking for does not exist or has been moved.'}">
                    The requested resource does not exist.
                </p>
                <div style="display: flex; justify-content: center; gap: 12px; flex-wrap: wrap;">
                    <a th:href="@{/learn}" class="btn btn-primary btn-sm">Explore Learn</a>
                    <a th:href="@{/dashboard}" class="btn btn-secondary btn-sm">Go to Dashboard</a>
                </div>
            </div>
        </main>
    </div>
</div>

<!-- Public Visitor Shell -->
<div th:if="${currentUser == null}">
    <nav th:replace="~{fragments/layout :: publicNav('')}"></nav>
    <main class="public-container" style="padding-top: 60px; padding-bottom: 80px;">
        <div class="card" style="max-width: 600px; margin: 0 auto; text-align: center; padding: 48px 24px;">
            <div style="font-size: 3.5rem; font-weight: 800; color: var(--bf-primary); margin-bottom: 12px;">404</div>
            <h1 style="font-size: 1.75rem; margin-bottom: 12px; color: var(--bf-navy-900);">Resource Not Found</h1>
            <p style="color: var(--bf-slate-600); margin-bottom: 28px; font-size: 1.0625rem;"
               th:text="${errorMessage != null ? errorMessage : 'The concept, topic, or page you are looking for does not exist or has been moved.'}">
                The requested resource does not exist.
            </p>
            <div style="display: flex; justify-content: center; gap: 12px; flex-wrap: wrap;">
                <a th:href="@{/learn}" class="btn btn-primary">Browse Learn Curriculum</a>
                <a th:href="@{/}" class="btn btn-secondary">Return Home</a>
            </div>
        </div>
    </main>
    <footer th:replace="~{fragments/layout :: publicFooter}"></footer>
</div>

</body>
</html>
